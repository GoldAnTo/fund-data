name: Feature request
description: Suggest a new provider, command, dataset, or workflow
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for any non-bug change. For new providers
        please read `fund-data/PROVIDERS.md` first — it has a
        "register your own provider" recipe and the Investoday
        onboarding flow as worked examples.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: |
        One or two sentences on the user pain. "As a [role], I want
        to [action] so that [outcome]" is a fine shape.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        What command, output, or workflow do you have in mind? If
        it touches the CLI, sketch the argparse sketch. If it
        touches a provider, name it.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: |
        Other approaches you considered, and why the proposed one
        is better. Skip if you only had one idea.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: |
        Links to upstream docs, screenshots, example payloads, or
        anything else that helps us evaluate the change.
    validations:
      required: false
