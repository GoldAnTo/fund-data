name: nightly-sync

on:
  # 02:00 UTC == 10:00 Asia/Shanghai. Daily snapshot+NAV refresh.
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider chain to use (auto, eastmoney, akshare, tushare, investoday)"
        required: false
        default: "eastmoney"
        type: choice
        options:
          - auto
          - eastmoney
          - akshare
          - tushare
          - investoday
      concurrency:
        description: "Concurrent fund fetches (4-16, default 8)"
        required: false
        default: "8"
        type: choice
        options:
          - "4"
          - "8"
          - "12"
          - "16"
      max_funds:
        description: "Cap for the run (empty = full universe)"
        required: false
        default: ""
        type: string

concurrency:
  # Prevent overlapping manual reruns while a scheduled run is still in flight.
  group: fund-data-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: "Resumable backfill (${{ inputs.provider || 'eastmoney' }})"
    runs-on: ubuntu-latest
    timeout-minutes: 720
    env:
      FUND_DATA_DB: fund-data/data/fund_data.sqlite
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          node-version: "24"
          cache: pip

      - name: Install AkShare into a venv
        run: |
          python -m venv /tmp/venv-akshare
          /tmp/venv-akshare/bin/pip install --upgrade pip
          /tmp/venv-akshare/bin/pip install -r requirements.txt

      - name: Ensure fund universe exists
        working-directory: fund-data
        run: |
          set -e
          mkdir -p data
          if [ -f "${FUND_DATA_DB}" ]; then
            COUNT=$(/tmp/venv-akshare/bin/python -c "
          import sqlite3
          conn = sqlite3.connect('${FUND_DATA_DB}')
          try:
              print(conn.execute('SELECT COUNT(*) FROM funds').fetchone()[0])
          except sqlite3.OperationalError:
              print(0)
          ")
          else
            COUNT=0
          fi
          if [ "$COUNT" = "0" ]; then
            echo "funds table is empty; seeding from Eastmoney (~5-10 min)..."
            /tmp/venv-akshare/bin/python scripts/fund_cli.py list \
              --provider eastmoney --limit 50000 \
              2>&1 | tee data/backfill_logs/list.log
            ROWS=$(/tmp/venv-akshare/bin/python -c "
          import sqlite3
          conn = sqlite3.connect('${FUND_DATA_DB}')
          print(conn.execute('SELECT COUNT(*) FROM funds').fetchone()[0])
          ")
            echo "seeded funds: $ROWS rows"
          else
            echo "funds table already has $COUNT rows; skipping list."
          fi

      - name: Run resumable backfill
        working-directory: fund-data
        run: |
          set -e
          ARGS=(--provider "${{ inputs.provider || 'eastmoney' }}"
                --concurrency ${{ inputs.concurrency || '8' }}
                --batch-size 100
                --nav-years 2
                --exclude-type 货币
                --log-level INFO)
          if [ -n "${{ inputs.max_funds }}" ]; then
            ARGS+=(--max-funds "${{ inputs.max_funds }}")
          fi
          /tmp/venv-akshare/bin/python scripts/backfill.py "${ARGS[@]}" \
            2>&1 | tee data/backfill_logs/scheduled.log

      - name: Doctor after backfill
        if: always()
        working-directory: fund-data
        run: |
          /tmp/venv-akshare/bin/python scripts/doctor.py --skip-network \
            > data/doctor-post.log 2>&1
          cat data/doctor-post.log

      - name: Fail workflow if doctor reported any check ok:false
        if: always()
        working-directory: fund-data
        run: |
          # Belt-and-suspenders: doctor already exits non-zero on failure,
          # but if any check ever prints ok:false without raising, fail here.
          if grep -q '"ok": false' data/doctor-post.log; then
            echo "::error::doctor reported at least one failing check (ok:false)"
            exit 1
          fi

      - name: Upload backfill summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backfill-summary-${{ github.run_id }}
          path: |
            fund-data/data/backfill_summary.json
            fund-data/data/backfill_state.json

      - name: Upload backfill log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backfill-log-${{ github.run_id }}
          path: fund-data/data/backfill_logs/

      - name: Notify on persistent failures
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const title = `🔴 nightly-sync failed at ${new Date().toISOString()}`;
            const body = [
              `**Workflow run**: ${runUrl}`,
              ``,
              `Nightly fund-data backfill/sync failed.`,
              ``,
              `- Check the workflow log (artifacts attached below).`,
              `- Inspect the \`sync_failures\` and \`dataset_errors\` tables in the data DB for stale or new failures.`,
              `- The doctor step also runs after the backfill; if it reported any check as \`ok: false\`, fix that first.`,
              ``,
              `<sub>Auto-opened by the nightly-sync workflow's P0.5 failure-notify step.</sub>`,
            ].join("\n");

            // Avoid piling up duplicate open issues for the same run.
            const stamp = context.runId;
            const labels = ["nightly-sync", "automated"];
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: labels.join(","), per_page: 5,
            });
            const dup = existing.data.find(i => i.title.includes(String(stamp)));
            if (dup) {
              core.info(`issue #${dup.number} already open for run ${stamp}; skipping`);
            } else {
              const issue = await github.rest.issues.create({
                owner, repo, title: `${title} (run ${stamp})`, body, labels,
              });
              core.info(`opened issue #${issue.number} for run ${stamp}`);
            }
