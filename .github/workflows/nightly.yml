name: nightly-data-plane-gate

# Nightly data-plane health gate. Runs the four-step
# ``scripts/ci/nightly_health_check.py`` runner and posts a
# per-step summary as a workflow artifact so the on-call
# human can diff against the previous night.
#
# See ``docs/nightly-ci-design.md`` for the design contract
# and the retry-vs-escalate discipline this gate enforces.
#
# Schedule: 03:00 Asia/Shanghai (19:00 UTC). The deploy key
# is set via OSS_DEPLOY_KEY_ID / OSS_DEPLOY_KEY_SECRET repo
# secrets -- not the user's personal ~/.ossutilconfig. The
# key only needs PutObject + GetObject on the
# ``fund-data-public-l`` bucket.

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-gate
  # Don't cancel in-progress runs on new trigger -- the nightly
  # backfill is long and we want it to finish, not restart.
  # New dispatch requests will queue until the in-progress run ends.
  cancel-in-progress: false

jobs:
  nightly-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: install-runtime-deps
        run: |
          python -m pip install -q -r requirements.txt

      - name: install-ossutil
        run: |
          # ossutil is the official Alibaba Cloud CLI. We pin
          # the release tag so the runner does not silently
          # pick up a newer build whose command-line surface
          # may have changed.
          #
          # Asset naming history (matters because the legacy
          # "ossutil64" name is what older docs and StackOverflow
          # answers still link to, and that name 404s on the
          # current release page):
          #   v1.7.18 and later  ->  ossutil-<ver>-linux-amd64.zip
          #                              binary inside:  ossutil
          #   pre-v1.7.18 (legacy) -> ossutil64-<ver>-linux.zip
          #                              binary inside:  ossutil64
          #
          # Zip layout gotcha (v1.7.18+): the binary is wrapped
          # in a top-level directory named after the asset, so
          # plain `unzip -d /tmp/ossutil` lands it at
          # /tmp/ossutil/ossutil-v1.7.18-linux-amd64/ossutil.
          # Use `unzip -j` to flatten and drop the top dir.
          curl -sSL -o /tmp/ossutil.zip \
            https://github.com/aliyun/ossutil/releases/download/v1.7.18/ossutil-v1.7.18-linux-amd64.zip
          unzip -jq /tmp/ossutil.zip -d /tmp/ossutil
          ls -la /tmp/ossutil
          sudo mv /tmp/ossutil/ossutil /usr/local/bin/ossutil
          rm -rf /tmp/ossutil /tmp/ossutil.zip
          ossutil --version

      - name: configure-ossutil-deploy-key
        run: |
          # ossutil 1.7.x: ~/.ossutilconfig must be a regular file, not a dir
          rm -rf ~/.ossutilconfig
          cat > ~/.ossutilconfig <<EOF
          [Credentials]
          accessKeyID=${{ secrets.OSS_DEPLOY_KEY_ID }}
          accessKeySecret=${{ secrets.OSS_DEPLOY_KEY_SECRET }}
          region=cn-shanghai
          endpoint=https://oss-cn-shanghai.aliyuncs.com
          EOF
          chmod 600 ~/.ossutilconfig
          # Debug: confirm the heredoc actually wrote the secrets
          # (and not the literal expression placeholder). The
          # GH log already masks secret values on display, but
          # verifying on disk catches the case where the
          # heredoc failed to expand the secret expression.
          echo "--- ~/.ossutilconfig (secrets masked by GitHub) ---"
          sed -E 's/(accessKey(ID|Secret)=).*/\1REDACTED/' ~/.ossutilconfig
          ls -la ~/.ossutilconfig
          # The deploy key only needs PutObject + GetObject on
          # ``fund-data-public-l``; that is the IAM policy that
          # produces the secret. Scope the smoke test to a
          # single ls so a misconfigured key fails fast.
          ossutil ls oss://fund-data-public-l/

      - name: pull-query-db
        # Pre-flight: CI runner starts with no local DB (the
        # 5.4GB fund_data.sqlite is gitignored). Pull the
        # query-only db from the project OSS bucket so the
        # downstream doctor / build-bundle / upload steps have
        # something to operate on. Pin the cache dir to
        # /tmp/nightly-cache so the gate step can resolve it
        # via FUND_DATA_CACHE_DIR.
        #
        # Retry up to 3 times: the OSS bucket occasionally
        # returns a 404 on the first GET of
        # current/manifest.json even though `curl` against the
        # same URL succeeds a second later. Transient edge-case
        # rather than a real outage; a 5s sleep + retry is
        # cheaper than debugging the bucket.
        env:
          FUND_DATA_CACHE_DIR: /tmp/nightly-cache
        run: |
          mkdir -p "$FUND_DATA_CACHE_DIR"
          for attempt in 1 2 3; do
            if python fund-data/scripts/fund_cli.py cloud pull \
                --cache-dir "$FUND_DATA_CACHE_DIR" \
                --output /tmp/nightly-artifacts/cloud-pull-init.json; then
              echo "cloud pull ok on attempt $attempt"
              break
            fi
            echo "cloud pull failed on attempt $attempt, sleeping 5s..."
            sleep 5
            if [ "$attempt" = "3" ]; then
              echo "cloud pull failed after 3 attempts"
              exit 1
            fi
          done
          # Debug: confirm the pull landed a db and the
          # current.json pointer was updated.
          echo "--- $FUND_DATA_CACHE_DIR ---"
          ls -la "$FUND_DATA_CACHE_DIR"
          echo "--- current.json ---"
          cat "$FUND_DATA_CACHE_DIR/current.json" 2>/dev/null || echo "(no current.json)"

      - name: run-nightly-gate
        id: gate
        env:
          FUND_DATA_CACHE_DIR: /tmp/nightly-cache
          PYTHONPATH: fund-data:$PYTHONPATH
        run: |
          set -o pipefail
          mkdir -p /tmp/nightly-release /tmp/nightly-artifacts
          # The gate resolves its DB via default_db_path(), which
          # honours FUND_DATA_CACHE_DIR (pointing at the pull
          # above). No --db override needed. PYTHONPATH=fund-data
          # lets `import fund_data` resolve to fund-data/scripts/
          # /fund_data.py from the repo root.
          python scripts/ci/nightly_health_check.py \
            --release-dir /tmp/nightly-release \
            --manifest-output /tmp/nightly-release/manifest.json \
            --output /tmp/nightly-artifacts/summary.json \
            | tee /tmp/nightly-artifacts/stdout.json
          rc=$?
          echo "exit_code=$rc"
          # Per-step outputs are written to the well-known
          # /tmp paths the runner pinned (see
          # nightly_health_check.py), so we just copy them
          # alongside the summary.
          cp /tmp/nightly-doctor.json /tmp/nightly-artifacts/ || true
          cp /tmp/nightly-build.json /tmp/nightly-artifacts/ || true
          cp /tmp/nightly-upload.json /tmp/nightly-artifacts/ || true
          cp /tmp/nightly-pull.json /tmp/nightly-artifacts/ || true
          exit $rc

      - name: upload-artifacts-on-failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-data-plane-failure-${{ github.run_id }}
          path: /tmp/nightly-artifacts/
          retention-days: 30

      - name: upload-artifacts-on-success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-data-plane-success-${{ github.run_id }}
          path: /tmp/nightly-artifacts/summary.json
          retention-days: 7
