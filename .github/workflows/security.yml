name: security

# Weekly dependency-vulnerability scan + scan on every push / PR.
# Uses pip-audit (PyPA-recommended) against requirements.txt which
# already pins the runtime akshare>=1.18.0,<2.0 range; a high or
# critical CVE fails the workflow, lower / unknown severities
# are logged for human triage.
#
# Why the previous version of this workflow failed in CI: it
# used bash process substitution \`<(echo ...)\` to add a second
# --requirement clause that duplicated requirements.txt. Process
# substitution is not portable across GH Actions runner shells,
# and pip-audit then scanned akshare twice. This rewrite drops
# the duplicate and moves the severity gate into a plain
# Python script (`.github/scripts/pip_audit_gate.py`) so there
# is no inline heredoc to escape or fail in a fresh runner.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every Monday 06:00 UTC (= 14:00 Asia/Shanghai, after the
    # Dependabot PR fan-out at 08:00 Asia/Shanghai). Catches new
    # CVEs that landed in the last 7 days.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install "pip-audit>=2.7"

      - name: Run pip-audit
        # Single --requirement covering the whole file. akshare
        # and every transitive dep are scanned exactly once.
        run: |
          pip-audit \
            --requirement requirements.txt \
            --strict \
            --format json > pip-audit.json
          # Mirror the human-readable log for the run page.
          pip-audit \
            --requirement requirements.txt \
            --strict \
            --format columns 2>&1 | tee pip-audit.log
        continue-on-error: false

      - name: Gate on high / critical CVEs
        if: always()
        run: |
          python .github/scripts/pip_audit_gate.py pip-audit.json

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-log
          path: |
            pip-audit.log
            pip-audit.json
