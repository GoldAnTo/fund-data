# Dependabot — keep the project honest about its dependencies.
# AkShare is the only runtime dependency. The `pip` ecosystem entry
# is the only one that matters at runtime; GitHub Actions and
# Docker are tracked for transparency.

version: 2
updates:
  # --- Python runtime / dev dependencies -------------------------------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    groups:
      runtime:
        patterns: ["akshare"]
      dev:
        patterns: ["black", "ruff", "pre-commit", "mypy"]
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "automated"

  # --- GitHub Actions ---------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "automated"
      - "ci"
