name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: "unittest on python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[test]

      - name: Run unit tests with coverage gate
        working-directory: fund-data
        run: |
          coverage run -m unittest discover scripts/tests -v 2>&1 | tee test-output.log
          # 81 % measured 2026-06-01 across 123 tests; 70 % gate
          # leaves headroom for new code that hasn't been touched
          # yet. Drop a file in # pragma: no cover rather than
          # lowering the gate.
          coverage report --include='scripts/*.py' --fail-under=70
          coverage xml -o coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: fund-data/coverage.xml

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-py${{ matrix.python-version }}
          path: fund-data/test-output.log
